# Variant 3 (bonus): instance noise + gradient penalty on real & generated samples [3]
name: wgangp_noise_r1r2
seed: 0

model:
  z_dim: 128
  g_ch: 256
  d_ch: 128

train:
  batch_size: 128
  train_iters: 100000
  decay_iters: 100000
  n_critic: 5
  lr: 2.0e-4
  betas: [0.0, 0.9]
  num_workers: 4

loss:
  type: real_fake         
  lam: 10.0               
  mode: zero              
  sigma0: 0.1             
  anneal_iters: 50000     

log:
  log_every: 100
  sample_every: 2000
  ckpt_every: 10000
  is_every: 10000
