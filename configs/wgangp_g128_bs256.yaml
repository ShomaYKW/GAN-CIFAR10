# Variant 2: WGAN-GP, G ResBlocks 128 filters, batch 256
name: wgangp_g128_bs256
seed: 0

model:
  z_dim: 128
  g_ch: 128               # <- changed
  d_ch: 128

train:
  batch_size: 256         # <- changed
  train_iters: 100000
  decay_iters: 100000
  n_critic: 5
  lr: 2.0e-4
  betas: [0.0, 0.9]
  num_workers: 4

loss:
  type: wgan_gp
  lam: 10.0

log:
  log_every: 100
  sample_every: 2000
  ckpt_every: 10000
  is_every: 10000
